name: 'revenueiq'
version: '1.0.0'
config-version: 2

profile: 'revenueiq'

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Staging models are lightweight views; marts are materialized tables the
# dashboard / report layer can read.
models:
  revenueiq:
    staging:
      +materialized: view
    marts:
      +materialized: table
